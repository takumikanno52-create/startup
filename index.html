<title>2026年9月27日のミーティング議事録</title>
<style>
  :root{
    --ink:#1e2733;
    --ink-2:#3b4757;
    --muted:#6b7a8d;
    --line:#e3e8ef;
    --line-strong:#cfd8e3;
    --accent:#1f4e79;
    --accent-2:#2f6ea8;
    --accent-soft:#eef4fa;
    --quote:#f4f8fc;
    --th:#f0f5fa;
    --warn:#8a5a00;
    --warn-bg:#fff8e8;
    --bg:#f4f6f9;
    --card:#ffffff;
    --radius:14px;
    --shadow:0 1px 2px rgba(24,44,72,.05), 0 8px 24px rgba(24,44,72,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI",YuGothic,Meiryo,system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:16px;
    line-height:1.95;
    -webkit-font-smoothing:antialiased;
    text-underline-offset:3px;
  }

  /* ---------- layout ---------- */
  .app{
    max-width:1420px;
    margin:0 auto;
    padding:26px 24px 80px;
    display:grid;
    grid-template-columns:310px minmax(0,1fr);
    gap:30px;
    align-items:start;
  }
  .sidebar{
    position:sticky;
    top:22px;
    max-height:calc(100vh - 44px);
    overflow:auto;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 16px;
  }
  .sidebar::-webkit-scrollbar{width:8px}
  .sidebar::-webkit-scrollbar-thumb{background:#d7dee8;border-radius:8px}

  /* ---------- header ---------- */
  .page-head{
    background:linear-gradient(135deg,#1f4e79 0%,#2f6ea8 60%,#3f86c4 100%);
    color:#fff;
    border-radius:var(--radius);
    padding:26px 28px 22px;
    box-shadow:var(--shadow);
    margin-bottom:24px;
  }
  .page-head .kicker{
    font-size:12.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    opacity:.85;
    margin:0 0 8px;
  }
  .page-head h1{
    margin:0 0 10px;
    font-size:26px;
    line-height:1.5;
    letter-spacing:.01em;
  }
  .page-head .lead{
    margin:0 0 14px;
    font-size:14px;
    line-height:1.85;
    color:#dfeaf5;
    max-width:78ch;
  }
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.28);
    border-radius:999px;
    padding:4px 12px;
    font-size:12.5px;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;
    margin:0 0 18px;
  }
  button,.btn{
    font-family:inherit;
    font-size:13px;
    color:var(--ink-2);
    background:#fff;
    border:1px solid var(--line-strong);
    border-radius:9px;
    padding:7px 13px;
    cursor:pointer;
    line-height:1.4;
    transition:.15s ease;
  }
  button:hover,.btn:hover{border-color:var(--accent-2);color:var(--accent);background:var(--accent-soft)}
  button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}

  /* ---------- search ---------- */
  .search-wrap{margin:0 0 14px}
  .search-wrap label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
  #search{
    width:100%;
    font-family:inherit;font-size:13.5px;color:var(--ink);
    padding:9px 11px;
    border:1px solid var(--line-strong);
    border-radius:9px;
    background:#fbfcfe;
  }
  #search:focus{outline:none;border-color:var(--accent-2);background:#fff;box-shadow:0 0 0 3px rgba(47,110,168,.12)}
  .search-info{font-size:12px;color:var(--muted);margin:7px 0 0;min-height:1.2em}

  /* ---------- sidebar toc ---------- */
  .toc-title{
    font-size:12px;letter-spacing:.1em;color:var(--muted);
    border-top:1px solid var(--line);
    padding-top:13px;margin:14px 0 8px;
  }
  #toc{display:flex;flex-direction:column;gap:6px}
  #toc a.top{
    display:block;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-2);
    text-decoration:none;
    padding:8px 10px;
    border-radius:8px;
    border-left:3px solid transparent;
    line-height:1.6;
    word-break:break-word;
  }
  #toc a.top:hover{background:var(--accent-soft);color:var(--accent)}
  #toc a.top.active{background:var(--accent-soft);color:var(--accent);border-left-color:var(--accent)}

  /* ---------- meeting card ---------- */
  .meeting{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin:0 0 24px;

    scroll-margin-top:24px;
  }
  .meeting-head{
    display:flex;align-items:flex-start;gap:12px;
    padding:18px 22px;
    background:linear-gradient(180deg,#fbfcfe,#f5f8fb);
    border-bottom:1px solid var(--line);
  }
  .meeting-head .toggle{
    flex:0 0 auto;
    width:30px;height:30px;
    display:grid;place-items:center;
    padding:0;
    border-radius:8px;
    font-size:12px;
    color:var(--accent);
    background:#fff;
  }
  .meeting-head .toggle::before{content:"▾"}
  .meeting.collapsed .meeting-head .toggle::before{content:"▸"}
  .meeting-head-text{flex:1 1 auto;min-width:0}
  .meeting-head h2{
    margin:0;
    font-size:19px;
    line-height:1.6;
    letter-spacing:.01em;
    color:var(--accent);
  }
  .meeting-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
  .tag{
    font-size:11.5px;
    background:#fff;
    border:1px solid var(--line-strong);
    border-radius:999px;
    padding:3px 11px;
    color:var(--ink-2);
  }
  .tag.date{background:var(--accent-soft);border-color:#cfe0f0;color:var(--accent);font-weight:700}
  .tag.brass{background:var(--warn-bg);border-color:#f0dfb8;color:var(--warn)}

  .md h3{

    width:100%;

    background:#fff;

  }
  .md thead th{

  }
  .md th,.md td{

  .md code{background:#f1f4f8;padding:1px 5px;border-radius:5px;font-size:13px}
  .md pre{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto}
  .md .note{

  .append textarea{

    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK JP",monospace;

<script type="text/markdown" id="minutes-source"># 議事録：付箋ブラッシュアップ（3語の定義・ずれ・課題仮説・ペルソナ・インタビュー）

## 参加者
菅野、瀬良、金子、小熊（全員参加）

## 議題
1. 3語（交流・豊かになる・人々）の定義のすり合わせ
2. ずれのすり合わせ
3. 課題仮説の作成
4. ペルソナ設定
5. インタビュー内容の決定

## 決定事項

### 1. 3語の定義のすり合わせ

> 時間・お金・機会の壁で交流の一歩目が出ない人々（旅に出る側も、迎える側も含む）が、人・感情・情報・お金・モノが行き来する関わり（訪問は問わない）を通じて、新しい視点や関係が日常に残るようになる

### 2. ずれのすり合わせ

**交流**
訪れる（人が動く）ことだけが交流ではない。人・モノ・お金・情報のいずれかが行き来し、その結果として知識や視点を得られることも交流である。

**豊かになる**
JTBの豊かさの語り方（社会・地球という大きな主語、心の豊かさという抽象語）と、実際に個人が体験のあとに得るもの（消費者が求めているもの、Get something）のあいだにズレがある。

**人々**
「人々」を大きな主語（社会・企業・動く人全体）のままにせず、より小さく具体的な誰か（個人・受け入れ側・地方の高校生）に絞り込もうとしている。

**1文にまとめると**
> 交流の価値を最も必要としているかもしれない具体的な個人（学生や受け入れ側も含む）が、時間・お金・機会の理由で、JTBが訪問や大きな主語（社会・組織）で語る交流の外側にいる

### 3. 課題仮説

| 区分 | 課題仮説 |
|---|---|
| メイン | 海外との接点はあっても関心がない |
| サブ | 受け入れ側の担い手が入れ替わるたび、知見や人脈がゼロに戻る |
| サブ | 訪問しない関わりが「交流」の項目に入っていない |

### 4. ペルソナ設定（項目のみ決定）

学生側のペルソナ項目：
- 年齢
- 職業
- 学年
- 住んでいる地域
- 困っていること
- 意識・関心
- 行動

※ 項目のみ決定。中身は未確定。

### 5. インタビュー内容（型のみ全員に共有）

質問は以下の4つ。

| 種類 | 質問 |
|---|---|
| 過去の行動を聞く | 最後に海外の人や文化に触れたのはいつ、どんな場面でしたか？（観光客、留学生、SNS、授業など）そのあと、何かしましたか？ |
| 時間・お金の使い方を聞く | 直近1か月で、趣味や遊びに使った時間とお金は、何にどれくらいでしたか？ |
| 価値観を聞く | 最近、時間を使って「やってよかった」と思ったことは何ですか？ |
| きっかけを聞く | 最近、新しく何かを始めたり興味を持ったりしたきっかけは何でしたか？ 逆に、海外に関わる誘い（交流イベントや留学生との食事など）を断った、または行かなかった経験はありますか？ |

- 支払い意欲を確認する質問は、ペルソナの中身が未確定のため意図的に外した。今後も追加しない。

## 次回確認事項
- 3語の定義（「時間・お金・機会の壁で一歩目が出ない人」＝環境・機会の壁）と、メインの課題仮説（「海外との接点はあっても関心がない」＝関心・心の壁）の整合性を確認する。

# 議事録：2026年10月5日のミーティング

日付：2026-10-05

## ミッションと定義の確認

- 前回決定した3号の定義を確認
  - 対象: 時間・お金・機会の不足で「一歩が出ない人々」
  - 旅に出る側・迎える側の両方を含む
  - 人・感情・情報・お金・物のやり取りを通じて新しい視点や関係が日常に残るようにする
- 課題仮説: 海外との接点があっても関心が生まれない

## ペルソナ設定

- 2つのペルソナを口頭発表形式で確認
- ペルソナA
  - 17歳・高校2年生・青森県在住
  - 海外は「自分に関係ない世界」と認識
  - 英語が苦手で最初から無理と思っている
  - SNSで海外コンテンツを見ることはあるが自分から調べない
  - 外国人との接触経験なし
- ペルソナB
  - 19〜20歳・大学2年生(就活前)・東京在住
  - 困りごとがないと自覚している
  - パスポート未所持・海外旅行の予定なし
  - 留学案内メールは流し読み、留学生に話しかけたことがない
  - 就活で海外経験を聞かれそうという漠然とした不安はある
- 2ペルソナの共通点: 意識・関心の低さ、行動を起こさない点で類似

## 解決策アイデア出し

- 修学旅行×インバウンド観光客との交流体験(陶芸・茶道など)
  - 強制的に接点を作れる点は評価
  - ただし学校スケジュールと観光客プランの調整が困難
  - 通訳コスト・教師負担・500人規模の運営が課題
- 学生が地方へ行き農業などを手伝う(長期休み活用)
  - 稼げる要素があれば動機になりうる
  - JTBとの連携可否が不明確
- 海外同世代の日常をスタンプ1つで解説するアプリ
  - JTBの153拠点・現地スタッフを活用できる可能性
- 大学授業・ゼミに海外同世代とのオンライン交流を組み込む
- 学生が地元の特産品を海外同世代に送り感想をもらう仕組み
  - ふるさと納税運営代行のノウハウを活用
- 友達と2人1組で申し込める留学プラン(誘われたら行く心理)
- 趣味(アニメ・ゲーム)を入り口にした海外同世代との共同制作

## 課題・定義のズレと見直し

- 課題仮説が「環境の壁」から「心の壁」にずれてきている矛盾を指摘
- 定義(新しい視点や関係が日常に残る)と解決策の整合性を再確認
- 能動的でない人はどんな仕組みでも動かないという根本的な問題
- 方向性の選択肢:
  - 課題を「環境」中心に再設定して解決策を作り直す
  - もしくは課題自体を変える(今しかタイミングがない)
- 「海外」に固定する必要があるか再検討
  - 定義からは外れないが、課題設定が狭くなりすぎる懸念

## 次回に向けた方針

- 課題を変更・深掘りする方向で合意
- 次回(明日)の宿題: 課題とビジネスプランを複数案考えてくる
- ペルソナは現状維持、改善策まで逆算で考える
- 夜9時からオンラインミーティングを設定
  - Discord画面共有で実施
- ビジコン発表は7分枠、数字・エビデンスの補強が必要

## Next Steps

  - 定義との整合性を意識しながら、改善策まで逆算で設計する。
- **夜9時からオンラインミーティングを開催**
  - Discord画面共有で実施。課題・プランを全員で詰める。

## プロジェクトの方向性：ピボットの決断

- 中心的な議論：課題特定アプローチを継続するか、アイディア先行アプローチにピボットするか
- 課題特定は行き詰まり：強い新仮説が出ず、チームが壁にぶつかっている
- 重要な気づき：課題特定は課題の評価基準に明示されていない
  - 評価基準は「既存製品・サービスとの差別化」「アセットの効果的活用」「スケーラビリティ」に焦点
- 合意：JTBの既存アセットと事業領域を起点にしたアイディア先行型にピボット
  - 考え方：JTBの既存サービスの穴を見つけ、それをつなげて新規事業を構成する
  - 「自分たちが作りたいだけ」の自己満足リスクを回避
- 定義・スコープの設定は引き続き必須：脱線防止のため、アイディアを制約するためではない
  - Kは連想ゲームで脱線しやすいと自覚あり；JTBを連想の起点に置くことで合意

## 議論されたアイディア

- **和幸の提案（現時点で最有力）：** DMO組織で人が変わるたびに知見と人脈が残らない
  - DMO（観光地域づくり法人）にはJTBから出向者が派遣されるが、人が入れ替わると組織知識が失われる
  - 根拠は観光庁のガイドライン（14ページ）から；現地調査ではない
  - 提案された改善策：
    - 「なぜこの施策を試みたか、なぜやめたか」を記録した意思決定台帳をJTBの既存の伴走型コンサルティングサービスに組み込む
    - 現在のDMOスタッフと元出向者をつなぐ窓口・チャネルの設置
    - 出向者中心から地域中心のガバナンスへの転換
  - 既存サービスの改善にとどまる可能性があり、明確な「新規事業」かどうかは要検討
- **Kの提案：** 在留外国人が日本人と交流したいが障壁がある
  - 提案：JTBの体験プログラムで外国人居住者と日本人参加者をマッチング
  - 新たな切り口：リベラルアーツや多様な視点を重視する企業の社員旅行をターゲットに
  - まだ粗い段階；データは群馬県限定のもので偏りがある可能性を指摘
- **その他のアイディア（未深掘り）：**
  - 観客の少ないローカルイベント（自転車レース、小規模式典など）向けのエキストラ・クラウドサービス
  - 修学旅行の再設計（より深い文化体験を促す）
  - 引っ越し・転居の不安解消：転居者が地域コミュニティとつながる仕組み

<script>
(function () {
  "use strict";

  var SOURCE = document.getElementById("minutes-source");
  var BASE_MD = SOURCE ? SOURCE.textContent.replace(/^\s*\n/, "") : "";
  var NO_DATE_NAME = "2026年9月27日のミーティング議事録"; // 本文に日付がない場合の会議名（1件目＝今回の議事録）
  var UNDATED_NAME = "日付未記載のミーティング議事録";      // 2件目以降で日付がない場合

  /* ---------- 会議名（日付から作る） ---------- */
  function nameFromDate(date, idx) {
    if (!date) return idx === 0 ? NO_DATE_NAME : UNDATED_NAME;
    var m = date.match(/(\d{4})\s*[-\/年]\s*(\d{1,2})\s*[-\/月]\s*(\d{1,2})/);
    if (!m) return idx === 0 ? NO_DATE_NAME : UNDATED_NAME;
    return m[1] + "年" + parseInt(m[2], 10) + "月" + parseInt(m[3], 10) + "日のミーティング議事録";
  }
  var STORE_KEY = "minutes_archive_added_v1";
  var listEl = document.getElementById("minutes-list");

  /* ---------- 追記分の読み書き（ブラウザ保存／失敗しても落ちない） ---------- */
  function loadAdded() {
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function saveAdded(arr) {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(arr)); return true; }
    catch (e) { return false; }
  }
  /* 共有保存：db が使えるときは全員共通の保存先、使えないときは従来どおりこのブラウザ内 */
  var dbc = null;          // db 名前空間（取得できたら入る）
  var canWrite = null;     // true / false / null（不明）
  var shared = [];         // 共有保存分 [{id, md}]
  var added = loadAdded(); // ブラウザ内保存分（db が使えないときの代替）
  var addedInMemory = [];

  function addedTexts() {
    if (dbc) return shared.map(function (d) { return d.md; });
    return added.concat(addedInMemory);
  }
  function hasAdded() { return addedTexts().length > 0; }

  function currentMarkdown() {
    var parts = [BASE_MD.replace(/\s+$/, "")];
    addedTexts().forEach(function (t) { if (t && t.trim()) parts.push(t.trim()); });
    return parts.join("\n\n");
  }

  /* ---------- Markdown → HTML ---------- */
  function toHtml(md) {
    if (typeof window.marked === "undefined") {
      var pre = document.createElement("pre");
      pre.textContent = md;
      return pre.outerHTML;
    }
    var opts = { gfm: true, breaks: true, headerIds: false, mangle: false };
    var html = (window.marked.parse || window.marked)(md, opts);
    // 補足メモ行（※…）を読みやすく
    html = html.replace(/<p>(※[^<]*)<\/p>/g, '<p class="note">$1</p>');
    return html;
  }

  /* ---------- 日付の抽出 ---------- */
  function detectDate(md) {
    var labeled = md.match(/日\s*付\s*[:：]\s*([^\n]+)/);
    if (labeled) return labeled[1].trim();
    var iso = md.match(/(20\d{2})[-\/年]\s*(\d{1,2})[-\/月]\s*(\d{1,2})/);
    if (iso) {
      var m = ("0" + iso[2]).slice(-2), d = ("0" + iso[3]).slice(-2);
      return iso[1] + "-" + m + "-" + d;
    }
    return "";
  }

  /* ---------- 参加者の抽出 ---------- */
  function detectAttendees(md) {
    var re = /^##+\s*(参加者|出席者|メンバー)\s*$/m;
    var hit = md.match(re);
    if (!hit) return "";
    var after = md.slice(md.indexOf(hit[0]) + hit[0].length).replace(/^\s*\n/, "");
    var line = after.split("\n").filter(function (l) { return l.trim() !== ""; })[0];
    if (!line) return "";
    line = line.replace(/^[-*・]\s*/, "").replace(/[*|]/g, "").trim();
    return line.length > 70 ? line.slice(0, 70) + "…" : line;
  }

  /* ---------- 見出し用の短いタイトル ---------- */
  function cleanTitle(t) {
    return t.replace(/^#+\s*/, "").replace(/^議事録\s*[:：]\s*/, "").trim() || "議事録";
  }

  /* ---------- 描画 ---------- */
  function render() {
    if (!listEl) return;
    listEl.innerHTML = "";
    var full = currentMarkdown();

    // 「# 」で始まる行を区切りとして会議ごとに分割
    var blocks = full.split(/\n(?=#\s)/).filter(function (b) { return b.trim() !== ""; });

    if (!blocks.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "議事録がまだありません。Markdown を追記してください。";
      listEl.appendChild(e);
      document.getElementById("toc").innerHTML = "";
      document.getElementById("chipCount").textContent = "収録 0 件";
      return;
    }

    var tocHtml = "";
    var count = 0;
    var meetingList = [];

    blocks.forEach(function (block, bi) {
      count++;
      var lines = block.split("\n");
      var title = cleanTitle(lines[0] || "");
      var mid = "mtg-" + (bi + 1);
      var section = document.createElement("section");
      section.className = "meeting";
      section.id = mid;

      var date = detectDate(block);
      var people = detectAttendees(block);
      var meetingName = nameFromDate(date, bi);
      meetingList.push({ date: date, name: meetingName });

      var head = document.createElement("div");
      head.className = "meeting-head";

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "toggle";
      btn.setAttribute("aria-label", "開閉");
      btn.addEventListener("click", function () { section.classList.toggle("collapsed"); });

      var headText = document.createElement("div");
      headText.className = "meeting-head-text";
      var h2 = document.createElement("h2");
      h2.textContent = meetingName;
      // 見出しクリックで開閉
      h2.addEventListener("click", function () { section.classList.toggle("collapsed"); });
      h2.style.cursor = "zoom-in";
      headText.appendChild(h2);

      var meta = document.createElement("div");
      meta.className = "meeting-meta";
      if (!date) {
        var nd = document.createElement("span");
        nd.className = "tag brass";
        nd.textContent = "日付未記載";
        meta.appendChild(nd);
      }
      if (people) {
        var pp = document.createElement("span");
        pp.className = "tag";
        pp.textContent = "参加者：" + people;
        meta.appendChild(pp);
      }
      headText.appendChild(meta);
      head.appendChild(btn);
      head.appendChild(headText);

      var body = document.createElement("div");
      body.className = "meeting-body md";
      body.innerHTML = toHtml(block);

      section.appendChild(head);
      section.appendChild(body);
      listEl.appendChild(section);

      // 会議ブロック内の見出しにはIDのみ付与（目次は会議ごとに1項目だけにする）
      body.querySelectorAll("h2, h3").forEach(function (h, hi) { h.id = mid + "-h" + (hi + 1); });
      tocHtml += '<a class="top" href="#' + mid + '">' + escapeHtml(meetingName) + "</a>";
    });

    document.getElementById("toc").innerHTML = tocHtml;

    // ページの題名＝会議名（日付があるもののうち最新。なければ先頭の会議名）
    var dated = meetingList.filter(function (x) { return x.date; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var pageName = dated.length ? dated[0].name : (meetingList.length ? meetingList[0].name : NO_DATE_NAME);
    document.title = pageName;
    var pageTitleEl = document.getElementById("pageTitle");
    if (pageTitleEl) pageTitleEl.textContent = pageName;

    // ヘッダー情報
    var dates = (full.match(/日\s*付\s*[:：]\s*([^\n]+)/g) || []).map(function (s) { return s.replace(/日\s*付\s*[:：]\s*/, "").trim(); })
      .concat((full.match(/(20\d{2})[-\/年]\s*\d{1,2}[-\/月]\s*\d{1,2}/g) || []).map(function (s) {
        var m = s.match(/(20\d{2})[-\/年]\s*(\d{1,2})[-\/月]\s*(\d{1,2})/);
        return m ? m[1] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[3]).slice(-2) : "";
      })).filter(Boolean).sort();
    if (!dates.length && pageName) {
      var pm = pageName.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
      if (pm) dates = [pm[1] + "-" + ("0" + pm[2]).slice(-2) + "-" + ("0" + pm[3]).slice(-2)];
    }
    document.getElementById("chipCount").textContent = "収録 " + count + " 件";
    document.getElementById("chipUpdated").textContent = "最終更新 " + (dates.length ? dates[dates.length - 1] : "—");

    var nAdded = added.length + addedInMemory.length;
    var chipAdded = document.getElementById("chipAdded");
    chipAdded.hidden = nAdded === 0;
    chipAdded.textContent = "追記 " + nAdded + " 件（このブラウザ保存）";

    syncActive();
    applyFilter();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- 検索（会議単位で絞り込み＋目次の絞り込み） ---------- */
  var searchEl = document.getElementById("search");
  function normalize(s) {
    return (s || "").toLowerCase().replace(/[\s　]/g, "");
  }
  function applyFilter() {
    if (!searchEl) return;
    var q = normalize(searchEl.value);
    var sections = listEl.querySelectorAll(".meeting");
    var hits = 0;
    sections.forEach(function (sec) {
      var hit = !q || normalize(sec.textContent).indexOf(q) !== -1;
      sec.style.display = hit ? "" : "none";
      if (hit) hits++;
    });
    // 目次側
    document.querySelectorAll("#toc a.top").forEach(function (a) {
      var hit = !q || normalize(a.textContent).indexOf(q) !== -1;
      a.style.display = hit ? "" : "none";
    });
    var info = document.getElementById("searchInfo");
    if (!q) { info.textContent = ""; }
    else if (hits === 0) { info.textContent = "該当なし（別のキーワードをお試しください）"; }
    else { info.textContent = hits + " 件の会議が該当しました"; }
  }
  if (searchEl) {
    searchEl.addEventListener("input", applyFilter);
    searchEl.addEventListener("keydown", function (e) { if (e.key === "Escape") { searchEl.value = ""; applyFilter(); } });
  }

  /* ---------- 目次のハイライト（スクロール連動） ---------- */
  var activeLinks = [];
  function syncActive() {
    activeLinks = [].slice.call(document.querySelectorAll("#toc a"));
    if (!("IntersectionObserver" in window)) return;
    var targets = [].slice.call(listEl.querySelectorAll(".meeting"));
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        activeLinks.forEach(function (a) { a.classList.remove("active"); });
        var a = document.querySelector('#toc a[href="#' + en.target.id + '"]');
        if (a) a.classList.add("active");
      });
    }, { rootMargin: "-15% 0px -70% 0px", threshold: 0 });
    targets.forEach(function (t) { io.observe(t); });
  }

  /* ---------- 追記パネル ---------- */
  var panel = document.createElement("div");
  panel.className = "append";
  panel.innerHTML =
    '<div class="append-head" id="appendHead">＋ 議事録を追記<span class="sub">Markdown を貼り付けて「追記する」を押すと、このページに会議が1件追加され、目次と検索にも反映されます。</span></div>' +
    '<div class="append-body">' +
      '<textarea id="appendText" spellcheck="false" placeholder="# 議事録：会議名&#10;日付：2026-10-05&#10;&#10;## 参加者&#10;菅野、瀬良&#10;&#10;## 議題&#10;1. …&#10;&#10;## 決定事項&#10;### 1. …&#10;&#10;## 次回確認事項&#10;- …"></textarea>' +
      '<div class="row">' +
        '<button type="button" id="appendPreview">プレビュー</button>' +
        '<button type="button" id="appendSave">追記する</button>' +
        '<button type="button" id="appendCopy">全文Markdownをコピー</button>' +
        '<button type="button" id="appendClose">閉じる</button>' +
      '</div>' +
      '<p class="hint">先頭は <code># 議事録：会議名</code> の1行から始め、次に <code>日付：2026-10-05</code> を書くとバッジが付きます。以降は <code>## 見出し</code> / <code>### 小見出し</code> / 表 / 箇条書き / <code>&gt; 引用</code> がそのまま使えます。このサイトでは、追記した内容はこのブラウザにだけ保存されます（他の人の画面には出ません）。全員に見せたい議事録は、「全文Markdownをコピー」で書き出して管理者に渡してください。</p>' +
      '<p class="status" id="appendStatus"></p>' +
      '<div class="preview-label" id="previewLabel" hidden>プレビュー</div>' +
      '<div class="preview md" id="appendPreviewBox" hidden></div>' +
    '</div>';
  listEl.parentNode.insertBefore(panel, listEl);

  var ta = document.getElementById("appendText");
  var statusEl = document.getElementById("appendStatus");
  var previewBox = document.getElementById("appendPreviewBox");
  var previewLabel = document.getElementById("previewLabel");

  document.getElementById("appendHead").addEventListener("click", function () { panel.classList.toggle("open"); });
  document.getElementById("btnAdd").addEventListener("click", function () {
    panel.classList.add("open");
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
    ta.focus();
  });
  document.getElementById("appendClose").addEventListener("click", function () { panel.classList.remove("open"); });

  document.getElementById("appendPreview").addEventListener("click", function () {
    var v = ta.value.trim();
    if (!v) { statusEl.className = "status err"; statusEl.textContent = "Markdown が入力されていません。"; return; }
    previewBox.innerHTML = toHtml(v);
    previewBox.hidden = false;
    previewLabel.hidden = false;
    statusEl.className = "status";
    statusEl.textContent = "プレビューを表示しました。「追記する」でページに追加します。";
  });

  var saving = false;
  document.getElementById("appendSave").addEventListener("click", function () {
    var v = ta.value.trim();
    if (!v) { statusEl.className = "status err"; statusEl.textContent = "Markdown が入力されていません。"; return; }
    if (!/^#\s/.test(v)) {
      v = "# 議事録\n\n" + v;
    }
    if (saving) return;
    function finish(ok, msg) {
      saving = false;
      if (ok) {
        ta.value = "";
        previewBox.hidden = true;
        previewLabel.hidden = true;
      }
      statusEl.className = ok ? "status" : "status err";
      statusEl.textContent = msg;
    }
    if (dbc) {
      if (canWrite === false) { finish(false, "このページを編集できる権限がないため、追記できません。"); return; }
      saving = true;
      statusEl.className = "status";
      statusEl.textContent = "保存しています…";
      dbc.collection("minutes").add({ md: v, at: Date.now() }).then(function () {
        finish(true, "追記しました。このページを開いている全員に反映されます。");
      }, function (e) {
        var code = e && e.code;
        finish(false, code === "invalid_argument"
          ? "このページを編集できる権限がないため、追記できませんでした。"
          : "保存できませんでした。時間をおいてもう一度お試しください。");
      });
      return;
    }
    added.push(v);
    var ok = saveAdded(added);
    if (!ok) { addedInMemory.push(v); }
    finish(ok, ok
      ? "追記しました（共有保存が使えないため、このブラウザにだけ保存しています）。"
      : "追記しました（保存が使えないため、今回の表示のみ有効です）。");
    render();
  });

  function copyAll(btn, label) {
    var text = currentMarkdown();
    var done = function () {
      var old = btn.textContent;
      btn.textContent = "コピーしました ✓";
      setTimeout(function () { btn.textContent = old; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(); });
    } else { fallback(); }
    function fallback() {
      var tmp = document.createElement("textarea");
      tmp.value = text;
      document.body.appendChild(tmp);
      tmp.select();
      try { document.execCommand("copy"); done(); } catch (e) {
        var old = btn.textContent;
        btn.textContent = "コピーできませんでした";
        setTimeout(function () { btn.textContent = old; }, 2200);
      }
      document.body.removeChild(tmp);
    }
  }
  document.getElementById("appendCopy").addEventListener("click", function () { copyAll(this); });
  document.getElementById("btnCopyAll").addEventListener("click", function () { copyAll(this); });

  document.getElementById("btnExpand").addEventListener("click", function () {
    listEl.querySelectorAll(".meeting").forEach(function (s) { s.classList.remove("collapsed"); });
  });
  document.getElementById("btnCollapse").addEventListener("click", function () {
    listEl.querySelectorAll(".meeting").forEach(function (s) { s.classList.add("collapsed"); });
  });
  var RESET_LABEL = "追記分を消す";
  var resetArmed = false, resetTimer = null;
  document.getElementById("btnReset").addEventListener("click", function () {
    var btn = this;
    if (!hasAdded()) {
      btn.textContent = "追記した内容はありません";
      setTimeout(function () { btn.textContent = RESET_LABEL; }, 2000);
      return;
    }
    if (!resetArmed) {
      resetArmed = true;
      btn.textContent = dbc
        ? "もう一度押すと、全員の画面から追記分が消えます"
        : "もう一度押すと追記分をすべて消します";
      resetTimer = setTimeout(function () { resetArmed = false; btn.textContent = RESET_LABEL; }, 5000);
      return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    if (dbc) {
      Promise.all(shared.map(function (d) { return dbc.doc("minutes/" + d.id).delete(); })).then(function () {
        btn.textContent = "削除しました ✓";
        setTimeout(function () { btn.textContent = RESET_LABEL; }, 2000);
      }, function () {
        btn.textContent = "削除できませんでした（権限がありません）";
        setTimeout(function () { btn.textContent = RESET_LABEL; }, 2600);
      });
      return;
    }
    added = []; addedInMemory = [];
    try { window.localStorage.removeItem(STORE_KEY); } catch (e) {}
    render();
    btn.textContent = "削除しました ✓";
    setTimeout(function () { btn.textContent = RESET_LABEL; }, 2000);
  });

  /* 閲覧専用の人には、追記・削除ボタンを出さない */
  function applyPermission() {
    var readOnly = (canWrite === false);
    document.getElementById("btnAdd").hidden = readOnly;
    document.getElementById("btnReset").hidden = readOnly;
    panel.hidden = readOnly;
  }

  render();

  /* 共有保存につなぐ（つながらなくても上の表示はそのまま動く） */
  if (window.claude && window.claude.use) {
    Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (user && typeof user.can === "function") {
        try { canWrite = user.can("data.write"); } catch (e) { canWrite = null; }
      }
      if (!db) { applyPermission(); return; }
      dbc = db;
      applyPermission();
      db.collection("minutes").orderBy("at", "asc").onSnapshot(function (snap) {
        shared = snap.docs.map(function (d) {
          var x = d.data() || {};
          return { id: d.id, md: String(x.md || "") };
        });
        render();
      }, function () {
        // 読み込みに失敗したら共有保存をあきらめ、ブラウザ内保存に戻す
        dbc = null; shared = []; render();
      });
    }, function () {});
  }
})();
</script>
</body>
</html>
